                intro: "提供 IT 解決方案與行銷推廣服務的科技公司。隨著客戶群擴大，現有 CRM 系統已無法滿足其進階的行銷自動化需求，且銷售部門與技術專案部門之間存在嚴重的資訊斷層。",
                odooSolution: "導入 Odoo CRM 與行銷自動化 (Marketing Automation) 模組，幫助其建立從行銷信件、潛在客戶培育到銷售簽約的完整漏斗。合約簽訂後，系統一鍵將銷售訂單轉換為 IT 服務專案任務，無縫交接給技術團隊。",
                modules: ["行銷自動化", "CRM 銷售漏斗", "專案與訂單整合"],
                results: [
                    "潛在客戶轉換率提升 25%",
                    "打破銷售與技術部門間的資訊孤島",
                    "業務營收預測更加精準可靠"
                ]
            },
            {
                companyName: "YAK FENG (H.K.) DEVELOPMENT LIMITED",
                industry: "批發與零售 (Wholesale / Retail)",
                image: "https://images.unsplash.com/photo-1553413077-190dd305871c?auto=format&fit=crop&w=800&q=80",
                intro: "專注於各類商品的進出口貿易與批發。面對龐大的海外供應商與本地經銷商，傳統依賴 Email 與 Excel 的訂單管理導致出錯率高、交期難以追蹤，且退換貨流程極度混亂。",
                odooSolution: "透過 Odoo 建立 B2B 專屬的入口網站與進出口採購流程，經銷商客戶可自行登入系統查看專屬報價與下單。系統自動生成相應的採購單給海外供應商，並串接物流文件，大幅減少人工操作與錯誤。",
                modules: ["B2B 客戶入口網站", "進出口採購管理", "退換貨管理 (RMA)"],
                results: [
                    "B2B 訂單處理成本減少 60%",
                    "客戶自助查詢訂單進度，降低客服負擔",
                    "端到端供應鏈數據透明度大幅提升"
                ]
            }
        ];

        // ==========================================
        // 渲染長捲動列表
        // ==========================================
        const listContainer = document.getElementById('case-list');

        function renderCaseList() {
            listContainer.innerHTML = '';
            
            caseData.forEach((data, index) => {
                // 判斷圖片在左邊還是右邊 (大螢幕時交錯顯示，增加視覺層次)
                const isImageRight = index % 2 !== 0;
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden flex flex-col lg:flex-row";
                
                const imageSection = `
                    <div class="lg:w-2/5 h-64 lg:h-auto relative">
                        <img src="${data.image}" alt="${data.companyName}" class="absolute inset-0 w-full h-full object-cover">
                        <div class="absolute top-6 left-6">
                            <span class="inline-block px-4 py-1.5 bg-blue-600/90 backdrop-blur text-white text-sm font-semibold rounded-full shadow-md">
                                ${data.industry}
                            </span>
                        </div>
                    </div>
                `;

                const contentSection = `
                    <div class="lg:w-3/5 p-8 md:p-12">
                        <h2 class="text-3xl font-bold text-gray-900 mb-8 border-b pb-4">${data.companyName}</h2>
                        
                        <div class="space-y-8">
                            <!-- 背景痛點 -->
                            <div>
                                <h3 class="text-xl font-bold text-gray-800 mb-3 flex items-center gap-2">
                                    <i class="fas fa-exclamation-circle text-orange-500"></i> 客戶背景與痛點
                                </h3>
                                <p class="text-gray-600 leading-relaxed">${data.intro}</p>
                            </div>
                            
                            <!-- 解決方案 -->
                            <div class="bg-blue-50/50 rounded-xl p-6 border border-blue-100">
                                <h3 class="text-xl font-bold text-blue-900 mb-3 flex items-center gap-2">
                                    <i class="fas fa-lightbulb text-blue-500"></i> Asta Systems 解決方案
                                </h3>
                                <p class="text-gray-700 leading-relaxed">${data.odooSolution}</p>
                            </div>
                            
                            <!-- 模組與成效 -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                                <div>
                                    <h4 class="font-bold text-gray-900 mb-3">導入核心模組</h4>
                                    <ul class="space-y-2">
                                        ${data.modules.map(m => `
                                            <li class="flex items-center text-gray-600 text-sm">
                                                <i class="fas fa-check text-green-500 mr-2"></i> ${m}
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                                <div class="bg-green-50/80 p-5 rounded-lg border border-green-100">
                                    <h4 class="font-bold text-green-900 mb-3">關鍵轉型成效</h4>
                                    <ul class="space-y-2">
                                        ${data.results.map(r => `
                                            <li class="flex items-start text-green-800 text-sm font-medium">
                                                <i class="fas fa-caret-right text-green-600 mt-1 mr-2"></i> <span>${r}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // 組合卡片 (依據 isImageRight 變更排版順序)
                if (isImageRight) {
                    card.innerHTML = contentSection + imageSection;
                    // 在大螢幕交換順序，手機版保持圖片在上方
                    card.className = "bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden flex flex-col lg:flex-row-reverse";
                } else {
                    card.innerHTML = imageSection + contentSection;
                }

                listContainer.appendChild(card);
            });
        }

        // 初始化渲染
        renderCaseList();
    </script>
</body>
</html>
